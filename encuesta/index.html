  --space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:40px;--space-6:64px;
  --radius-sm:8px;--radius-card:32px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--red)}
body{
  margin:0;min-height:100dvh;color:var(--ink);font-family:var(--font-body);font-weight:400;
  background:radial-gradient(ellipse 70% 22% at 50% 100%,var(--red-deep) 0%,rgba(149,42,50,0) 100%),var(--red);
  background-repeat:no-repeat;padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 24px}

/* idioma */
.lang{position:absolute;top:14px;right:14px;display:flex;gap:2px;background:rgba(0,0,0,.22);border-radius:9999px;padding:3px}
.lang button{font:400 17px var(--font-caps);letter-spacing:.14em;border:0;background:transparent;color:var(--cream);padding:6px 13px 4px;border-radius:9999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--red-dark)}

/* titular de pincel: línea 1 ink, línea 2 ink-strong */
.hero{text-align:center;padding:68px 0 26px}
h1.brush{margin:0;font-family:var(--font-brush);font-weight:400;font-size:clamp(46px,13.6vw,80px);line-height:1;text-transform:uppercase}
h1.brush span{display:block;white-space:nowrap}
html[lang="en"] h1.brush{font-size:clamp(38px,11.2vw,72px)}
h1.brush .a{color:var(--ink)} h1.brush .b{color:var(--ink-strong)}
/* copy: frase 1 regular + frase 2 bold */
.copy{margin:28px auto 0;max-width:420px;font-size:clamp(19px,5.2vw,23px);line-height:1.5;color:var(--ink)}
.copy b{font-weight:700}

/* tarjetas */
.card{background:var(--card);color:var(--on-card);border-radius:var(--radius-card);padding:var(--space-4) var(--space-4) var(--space-4);margin:14px 0}
.qn{font:400 24px/1 var(--font-caps);letter-spacing:.16em;color:var(--red)}
.q{margin:8px 0 4px;font-family:var(--font-body);font-weight:700;font-size:19px;line-height:1.3}
.hint{margin:0 0 14px;font-size:14.5px;line-height:1.45;color:var(--button-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:400 15px var(--font-body);color:var(--on-card);background:#F6F3E6;border:1.5px solid rgba(0,0,0,.2);border-radius:9999px;padding:10px 16px;min-height:44px;cursor:pointer;transition:background .12s,color .12s,transform .08s}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--cream);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
textarea{width:100%;margin-top:12px;border:1.5px solid rgba(0,0,0,.2);border-radius:20px;background:var(--white);font:400 16px/1.45 var(--font-body);color:var(--on-card);padding:12px 14px;resize:vertical;min-height:84px}
textarea::placeholder{color:#7a7566}
.q-open textarea{margin-top:0;min-height:112px}
.chip:focus-visible,textarea:focus-visible,.cta:focus-visible,.lang button:focus-visible{outline:3px solid var(--gold-glow);outline-offset:3px}
.card .chip:focus-visible,.card textarea:focus-visible{outline-color:var(--red)}

/* CTA (variante solid sobre tarjeta crema) */
.sendcard{background:var(--card);color:var(--on-card);border-radius:var(--radius-card);padding:var(--space-4);margin:14px 0 6px;text-align:center}
.cta{display:inline-flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:var(--radius-card);background:var(--red);color:var(--cream);
  font:700 27px/1 var(--font-label);letter-spacing:.01em;padding:20px 24px;cursor:pointer;text-decoration:none;transition:opacity .15s,transform .08s}
.cta:active{transform:scale(.985)}
.cta:disabled{opacity:.4;cursor:not-allowed}
.cta.card-v{background:var(--card);color:var(--on-card);width:auto;padding:18px 34px}
.note{margin:12px 0 0;font-size:14px;color:var(--button-ink)}
.err{margin:14px 0 0;background:var(--black);color:var(--cream);border-radius:16px;padding:12px 14px;font-size:14.5px;font-weight:700;display:none}
.err.on{display:block}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* gracias — botón de elevador 22 */
#thanks{display:none;text-align:center;padding:72px 0 8px}
#thanks.on{display:block}
.eb{position:relative;width:268px;height:268px;margin:0 auto 34px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(circle,var(--button-ring) 0%,var(--button-ring) 66%,rgba(199,87,65,.35) 72%,rgba(199,87,65,0) 100%)}
.eb-face{width:226px;height:226px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 55% 45%,var(--gold-glow) 0%,var(--button-face) 55%,var(--button-face) 75%,var(--button-shade) 100%)}
.eb-press{font:400 24px/1 var(--font-caps);letter-spacing:.16em;padding-left:.16em;color:var(--red-dark)}
.eb-num{font:700 98px/.95 var(--font-body);letter-spacing:-.01em;color:var(--red);margin-top:4px}
.eb-tag{font:400 15px/1 var(--font-caps);letter-spacing:.08em;color:var(--button-ink);margin-top:10px}
.thx-copy{margin:22px auto 0;max-width:380px;font-size:20px;line-height:1.5}
.thx-copy b{font-weight:700}
#thanks .cta{margin-top:28px}

/* pie: logo + pisos */
footer{text-align:center;padding:36px 0 30px}
.logo{display:block;width:232px;max-width:70%;height:auto;margin:0 auto}
.floors{margin-top:22px;font:400 18px/1 var(--font-caps);letter-spacing:.16em;color:var(--ink-muted)}
.floors b{font-weight:400;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

const qs = new URLSearchParams(location.search);
const preview = qs.has("preview");
const src = (qs.get("src")||"direct").slice(0,24).replace(/[^\w-]/g,"");
let lang = (qs.get("lang") || (navigator.language||"es")).toLowerCase().startsWith("en") ? "en" : "es";
const state = {improve:null};

const $ = id => document.getElementById(id);
function chips(box, list){
  box.innerHTML = "";
  list.forEach(([id,l])=>{
    const b = document.createElement("button");
    b.type="button"; b.className="chip"; b.dataset.id=id; b.textContent=l[lang];
    b.setAttribute("aria-pressed", state.improve===id);
    box.appendChild(b);
  });
}
function render(){
  const t = T[lang];
  document.documentElement.lang = lang; document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  document.querySelectorAll("[data-i-html]").forEach(e=>e.innerHTML=t[e.dataset.iHtml]);
  document.querySelectorAll("[data-i-ph]").forEach(e=>e.placeholder=t[e.dataset.iPh]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  chips($("improve"),IMPROVE);
  $("send").textContent = t.send;
}
function hasAnswer(){
  return $("menu").value.trim()||state.improve||$("delivery").value.trim()||$("roomservice").value.trim()||$("improveText").value.trim();
}
function refresh(){ $("send").disabled = !hasAnswer(); }

document.querySelector(".lang").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; lang=b.dataset.lang; render();
});
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  state.improve = state.improve===c.dataset.id ? null : c.dataset.id;
  chips($("improve"),IMPROVE);
  refresh();
});
$("menu").addEventListener("input",refresh);
$("delivery").addEventListener("input",refresh);
$("roomservice").addEventListener("input",refresh);
$("improveText").addEventListener("input",refresh);

$("f").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!hasAnswer()) return;
  $("err").classList.remove("on");
  if($("website").value){ done(); return; }          // honeypot
  const body = {
    v:1, lang, src,
    menu:$("menu").value.trim(), delivery:$("delivery").value.trim(), roomservice:$("roomservice").value.trim(), improve:state.improve, improveText:$("improveText").value.trim()
  };
  const btn=$("send"); btn.disabled=true; btn.textContent=T[lang].sending;
  try{
    if(preview){ await new Promise(r=>setTimeout(r,500)); }
    else{
      if(!ENDPOINT) throw new Error("no endpoint");
      const r = await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!r.ok) throw new Error("http "+r.status);
    }
    done();
  }catch(err){
    btn.textContent=T[lang].send; btn.disabled=false; $("err").classList.add("on");
  }
});
function done(){
  $("formView").style.display="none"; $("thanks").classList.add("on"); window.scrollTo({top:0});
}
render(); refresh();
</script>
